      #       -H "Authorization: Token $BUTTONDOWN_API_KEY" \
      #       -H "Content-Type: application/json" \
      #       -d '{"subject":"New from Creek Bay","body":"Fresh drops are up — check the site: https://creekbayrecords.com"}'
